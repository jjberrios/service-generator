execution:
  status: observed
  kind: batch-shell
  httpEndpoints: none
  evidence: [E-MAIN, E-README, E-SERVICE-IMPL, E-CONTEXT]
  invocation:
    command: 'java -Dproperties=<external .properties path> -jar <artifact>.jar <idTransaccion>'
    commandEvidence: 'Derived from E-README (java -jar ... <idTransaccion>) plus E-CONTEXT (file:${properties}); the README omits the -Dproperties option. No launcher script, scheduler definition or Jenkinsfile exists in the reference.'
    commandVerified: false
    launcherScript: not-present-in-reference
    scheduler: unknown
  arguments:
    - {index: 0, name: idTransaccion, required: true, validated: false, usage: 'traceability prefix "[idTx=<id>]" and passed to service.run'}
  jvmProperties:
    - {name: properties, purpose: 'path of the external properties file (resolved by <context:property-placeholder location="file:${properties}"/>)'}
  externalFiles:
    - {name: '<PROPERTIES_FILE_BASENAME>.properties', purpose: 'environment configuration, kept outside the jar; contains encrypted credentials in the reference (values never inspected)'}
    - {name: 'log4j properties file', purpose: 'path given by key log4j.file.dir; configured via PropertyConfigurator AFTER the Spring context is created; file not present in the reference (SH-Q-003)'}
  technicalFlow:
    - 'main: args[0] -> idTransaction; msjTrx = "[idTx=<id>]"'
    - 'create ClassPathXmlApplicationContext(applicationContext.xml) (component-scan + external property placeholder)'
    - 'bean of main class -> loadLog4J() -> start(msjTrx, idTransaction)'
    - 'start: delegate to <Service>.run(msjTrx, idTransaction); any Exception is logged, never propagated'
    - 'finally: log total elapsed time and close the Spring context'
    - 'service.run (generated from Sparx): reads external properties, performs the batch work, counts successes/errors, logs a summary and the idf0/idf1 (or idt*) code/message; catches exceptions by type (WS, SFTP, general)'
  errorHandling:
    pattern: 'catch-log-continue; exceptions typed WSException (code+message), SFTPException (server/path), general Exception with idt3 message; connections closed in finally'
    technicalCodes: 'idt1 timeout, idt2 availability, idt3 general; idf0 success, idf1 partial/error; messages carry [RECURSO]/[DETALLE] placeholders replaced at runtime'
  exitCode:
    systemExitCalled: false
    observed: 'Process always ends with JVM default status (0) unless args[0] is missing (uncaught ArrayIndexOutOfBounds before the try). idf0/idf1 codes are only logged.'
    readmeClaim: 'README documents codes 0 (success) and 1 (error) as "Códigos de Respuesta"; the code does not call System.exit. Resolved by SH-Q-001 (user: follow the reference): generated batches keep the observed behavior (no System.exit; codes only logged); README discrepancy remains documented.'
  fileHandling:
    observed: 'download from a remote SFTP into a local temp directory, upload from temp to another SFTP (create remote directories recursively); empty downloads reported as ALERTA/ERROR; no local cleanup of temp files observed'
    ownedBy: 'Sparx (which files, when, where); technical SFTP helpers are in template utilities'
  database:
    mechanism: not-present-in-reference
    note: 'applicationDatasource.xml (DriverManagerDataSource) exists but is not imported by applicationContext.xml and no DAO/JDBC code exists; ojdbc6 jar in Lib/ is not declared in the POM. Not a persistence baseline (SH-Q-009).'
  testingMode:
    primary: 'manual running of the packaged jar with an external properties file (no HTTP, no integration harness in the reference)'
    unit: 'JUnit4 + Mockito unit test of the service with mocked SFTP managers and mocked WS (see quality.tests)'
    executedHere: false
