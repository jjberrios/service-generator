plugins:
  - coordinate: org.apache.maven.plugins:maven-compiler-plugin
    version: "3.8.1"
    configuration: {release: "21"}
    evidence: E-008
  - coordinate: org.apache.maven.plugins:maven-surefire-plugin
    version: "2.22.2"
    configuration: {reuseForks: true}
    evidence: E-007
  - coordinate: org.springframework.boot:spring-boot-maven-plugin
    version_source: spring-boot-parent
    configuration: {exclude_from_package: [org.projectlombok:lombok]}
    evidence: E-008
  - coordinate: org.apache.maven.plugins:maven-checkstyle-plugin
    version: "3.3.1"
    phase: validate
    goals: [check]
    configuration:
      include_test_sources: true
      rules: src/main/resources/checkstyle.xml
    evidence: E-009
  - coordinate: org.jacoco:jacoco-maven-plugin
    version: "0.8.11"
    phases:
      prepare-agent: default
      report_and_check: test
    plugin_dependencies:
      - {coordinate: org.apache.maven.doxia:doxia-core, version: "1.11.1"}
    approved_decision: D-004
    evidence: E-010

quality:
  checkstyle:
    enabled: true
    line_length: 250
    indentation_spaces: 4
    evidence: E-009
    approved_decision: D-014
    mandatory_generation_gate: true
    config: src/main/resources/checkstyle.xml
    include_test_source_directory: true
    sources: [src/main/java, src/test/java]
    authority: the complete reference checkstyle.xml (not a list of known rules)
    suppressions_allowed: false
    generated_code_exclusions_allowed: false
    weakening_allowed: false
    syntax_parse_substitutes_checkstyle: false
    unexecutable_status: unverified
    pass_requires: 0 violations
    known_violating_patterns:
      - annotation-array children indented outside {6, 12} (basic 4 + arrayInitIndent 2, or line wrap 8 + 4)
      - switch expression directly after an opening parenthesis (WhitespaceAround)
      - local variable declared more than 3 statements before first use (VariableDeclarationUsageDistance)
      - numeric literal outside -1, 0, 1, 2, 4, 200, 201, 400, 401, 403, 404, 418, 500, 1000 (MagicNumber, also in tests; use meaningful constants)
  jacoco:
    enabled: true
    counter: INSTRUCTION
    value: COVEREDRATIO
    element: PACKAGE
    minimumCoverage: 80
    baseline: reference pom.xml (D-012); only the target package path is substituted
    default_exclusions:
      - "**/client/**"
      - "**/configuration/**"
      - "**/controller/**"
      - "**/dto/**"
      - "**/exception/**"
      - "**/model/**"
      - "**/security/**"
      - "**/kafka/**"
      - "**/repository/**"
      - "__BASE_PACKAGE_PATH__/*.class"
    approved_decision: D-004
    evidence: E-010
  sonar:
    baseline: reference pom.xml sonar.coverage.exclusions (D-012); only the application class name is substituted
    independently_configurable_from_jacoco: true
    default_exclusions:
      - "**/client/**"
      - "**/configuration/**"
      - "**/controller/**"
      - "**/dto/**"
      - "**/exception/**"
      - "**/model/**"
      - "**/security/**"
      - "**/kafka/**"
      - "**/__APPLICATION_CLASS__.java"
    approved_decision: D-004
    evidence: E-010

testing:
  framework: JUnit Jupiter
  mocking: Mockito
  conventions:
    - tests mirror production package paths
    - unit tests use the Test suffix
    - isolated tests use MockitoExtension, Mock, and InjectMocks
    - Nested and DisplayName may group scenarios
  generated_test_content_owner: OpenAPI and Sparx
  evidence: E-007

package_structure:
  root: __BASE_PACKAGE__
  reusable_static:
    - configuration.openapi
    - configuration.security
    - security.filter
    - security.service
    - security.service.impl
  generated_from_specification:
    - controller
    - controller.impl
    - dto.request
    - dto.response
    - dto.mapper
    - service
    - service.impl
    - client
    - model
    - repository
    - exception
  evidence: E-011

package_naming:
  base_package_template: com.claro.<normalized-service-identity>.support
  corporate_namespace: com.claro
  service_identity_normalization:
    lowercase: true
    hyphen_separator: dot-separated-package-segments
    prefix_removal: only-when-explicitly-authorized-for-the-target
  technical_suffix: support
  base_package_path_rule: replace-dots-with-slashes
  approved_decision: D-008

activity_logging:
  approved_decision: D-013
  mandatory: true
  evidence: E-025
  origin: local reference utility (no corporate dependency); inspected in the approved reference project, not invented
  reference_classes: [utils/ActivityLogger, utils/ConstanApi, dto/request/RequestHeaders, service implementation (ejecutarActividad, logGet/logCreate/logUpdate), utils/ActivityLoggerTest]
  template_files:
    - {path: template/src/main/java/__BASE_PACKAGE_PATH__/utils/ActivityLogger.java, sha256: fa1972dd8a91c9767dcad4560f42b7758ec835ba4de5f952802a6150671f05fb, role: ActivityLogger utility copied from the reference (package token only)}
    - {path: template/src/main/java/__BASE_PACKAGE_PATH__/utils/ConstanApi.java, sha256: df95238e55038301ce117be92668ed6ba875240e75ebce6e4ad258a80fca8ce3, role: reusable technical constants (separators); activity and log-message constants are generated from the service specification after the ACTIVIDADES (LOGS) marker comment}
    - {path: template/src/test/java/__BASE_PACKAGE_PATH__/utils/ActivityLoggerTest.java, sha256: b83401316e4f61a3c6c0f5c0ae82ea2c4be7e33e79bda00ed6e0bc19b4c62f20, role: reference ActivityLoggerTest}
  dependencies_required: none beyond the Maven baseline (slf4j, Jackson databind and jsr310 via spring-boot-starter-web, Lombok @Slf4j)
  activity_logger:
    start: "ActivityLogger.inicioActividad(Logger, mensajeTransaccion, actividad): three info lines - SEPARADOR; mensajeTransaccion + INICIO_ACTIVIDAD + actividad + SEPARADOR_ACTIVIDAD; SEPARADOR"
    end: "ActivityLogger.finActividad(Logger, mensajeTransaccion, actividad): same structure with FIN_ACTIVIDAD"
    body: "ActivityLogger.logContenido(Logger, mensaje, Object contenido, Class<T> tipo): ObjectMapper(JavaTimeModule).convertValue(contenido, tipo), pretty-printed, log.info(mensaje, bodyJson); on any exception log.error(\"Error serializando body: {}\", message)"
    masking: none - the reference filters and masks nothing; none is added by the archetype
  transaction_prefix:
    local_variables: "String tx = headers != null ? headers.transactionId() : null; String menTran = tx != null ? \"[\" + tx + \"] \" : NO_TRANSACTION_PREFIX;"
    no_transaction_prefix: "[SIN-TRANSACTION] "
    transaction_identifier: the transactionId component of the service RequestHeaders model, mapped explicitly from a declared target header (never from a business field)
  request_headers_model:
    location: dto/request/RequestHeaders (Java record)
    reference_components: [transactionId, msgid, timestamp, userId, applicationName]
    rule: one component per reference role that has a corresponding header declared by the target contract (transactionId mandatory); components without a target header are omitted, never invented
    role_matching: "transactionId <- header named transactionId, else the single header whose name contains 'correlation'; userId <- header whose name without a leading x- is userid; applicationName <- header whose name without a leading x- is applicationname or appid; an explicit planning-input mapping overrides derivation; anything ambiguous or missing for transactionId fails planning"
  service_methods: receive RequestHeaders as first parameter (reference signature style)
  activity_wrapper:
    name: ejecutarActividad
    signature: "private <T> T ejecutarActividad(String menTran, String actividad, Supplier<T> accion)"
    behavior: "ActivityLogger.inicioActividad(log, menTran, actividad); T result = accion.get(); ActivityLogger.finActividad(log, menTran, actividad); return result"
    business_exception: "catch the service business exception: log.error(\"{} ERROR [{}] message={}\", menTran, actividad, ex.getMessage()); rethrow"
    unexpected_exception: "catch Exception: log.error(\"{} ERROR [{}] unexpected exception={}\", menTran, actividad, ex.getMessage()); rethrow"
    swallowing_exceptions: forbidden
  request_logging:
    helpers: "private void log<Operation>(RequestHeaders h, <supplied request values>) - one per active operation"
    metadata_line: "<OperationName> applicationName={}, transactionId={}, msgid={}, timestamp={}, userId={}[, request values] (components absent from the target header model are omitted)"
    body: "ActivityLogger.logContenido(log, \"<OperationName> body: {}\", body, <BodyType>.class) - never body.toString() or a direct serialization"
    controller_entry: "log.info(\"<operation> - transactionId: {}[, usuario: {}]\", ...) in the controller (@Slf4j), as the reference controller does"
  error_logging:
    business: "inside the behavior activity: log.error(\"{} ERROR [{}] code={} detail={}\", menTran, ACT, status, detail) then throw the business exception"
    technical_timeout: "catch QueryTimeoutException: log.error(\"{} {}: {}\", menTran, LOG_TIMEOUT_<ACT>, e.getMessage()); then the target's approved timeout mapping"
    technical_data: "catch DataAccessException: log.error(\"{} {}: {}\", menTran, LOG_ERROR_DATOS_<ACT>, e.getMessage()); then the target's approved mapping"
    validation_in_handler: "framework 400 failures are logged under the validation activity (inicioActividad, log.error, finActividad) when every active operation shares one validation activity constant"
    note: logging is instrumentation around the approved behavior and never changes status mapping
  activity_constants:
    source: the authoritative activities of each operation in service-spec.yml (behavior.sources / process flow); never invented
    name: "ACT<n>_<NORMALIZED_NAME> for the Sparx activity named '<n>. <Name>' (accents removed, uppercase, non-alphanumerics to underscore)"
    value: "<NORMALIZED_NAME>"
    log_messages: "LOG_TIMEOUT_<ACT> and LOG_ERROR_DATOS_<ACT> for each behavior activity that accesses persistence"
    forbidden: reference-service constants and messages (for example Individual-specific names), artificial steps created only to produce logs

persistence:
  approved_decision: D-011
  authority_order: [explicit user instruction, explicit target-specific approved technical requirement, approved archetype/reference architecture]
  technology: spring-data-jpa
  provider: hibernate
  connection_pool: hikaricp
  database: oracle
  inherited_from_archetype: true
  jdbc_replacement_allowed_only_when: explicit user instruction or explicit authoritative target technical requirement
  planner_preference_or_simplicity_is_not_a_reason: true
  conventions:
    entity: "Lombok @Data/@NoArgsConstructor/@AllArgsConstructor; jakarta.persistence @Entity, @Table(name=...), @Id, @Column(name=...); entities live in the model package"
    table_schema: "@Table schema is set only when the target specification defines one; the reference's schema value is never copied"
    id_generation: "@GeneratedValue(strategy = GenerationType.IDENTITY) on the primary key (reference convention); real database mechanism remains an explicit runtime risk, no sequence is invented"
    types: "Long for NUMBER keys, Integer for numeric flags, String for text, LocalDate/LocalDateTime for date columns, no Boolean conversion"
    repository: "interface extending JpaRepository<Entity, Long> annotated @Repository, in the repository package; derived finders where possible"
    dynamic_queries: "No dynamic-query mechanism appears in the reference. When a target behavior needs one, JpaSpecificationExecutor/Specification is the permitted extension of the same Spring Data JPA repository; manual SQL concatenation is forbidden"
    audit_timestamps: "set in the service with LocalDateTime.now(ZoneId.systemDefault()) before save (reference convention)"
    transactions: "no explicit @Transactional in the reference; Spring Data repository methods are transactional"
    exceptions: "service catches QueryTimeoutException (-> timeout) and DataAccessException (-> unavailable) around repository calls; target specifications may refine the status mapping"
  evidence: E-023

runtime:
  application_properties:
    static:
      spring.threads.virtual.enabled: true
      server.port: 8085
      logging.level.root: INFO
      logging.level.org.apache.hc.client5.http: DEBUG
      management.health.db.enabled: true
      spring.datasource.driver-class-name: oracle.jdbc.OracleDriver
      spring.datasource.hikari.maximum-pool-size: 5
      spring.datasource.hikari.auto-commit: false
      spring.datasource.hikari.connection-timeout: 1000
      spring.datasource.hikari.minimum-idle: 3
      spring.datasource.hikari.connection-test-query: select 1 from dual
      spring.jpa.show-sql: false
      spring.jpa.generate-ddl: false
      spring.jpa.hibernate.ddl-auto: validate
      spring.jpa.properties.hibernate.jdbc.timeout: 1
      spring.cloud.compatibility-verifier.enabled: false
      springdoc.swagger-ui.path: /swagger-ui.html
      springdoc.swagger-ui.disable-swagger-default-url: true
      management.health.defaults.enabled: true
      management.health.livenessstate.enabled: true
      management.health.readinessstate.enabled: true
      management.endpoints.web.exposure.include: health
      management.endpoint.health.show-details: always
    parameterized:
      spring.application.name: __SERVICE_NAME__
      springdoc.packagesToScan: __BASE_PACKAGE__
      logging.level.__BASE_PACKAGE__: DEBUG
      security.jwt.roles-claim: __JWT_ROLES_CLAIM__
    environment_only:
      security.jwt.secret-key: JWT_SECRET_KEY
      spring.datasource.url: DB_URL
      spring.datasource.username: DB_USERNAME
      spring.datasource.password: DB_PASSWORD
    excluded_reference_sections:
      - SUBTYPES IDF (subtype.*, detail.*, message.*): domain/service-specific properties
    baseline_blocks: [APPLICATION, LOGGING, SWAGGER, ACTUATOR, DATA SOURCE, HIKARI, JPA / HIBERNATE, JWT TOKEN, SPRING CLOUD]
    baseline_decision: D-011
    jwt_secret_note: The reference declares a development-only default for JWT_SECRET_KEY; D-002 (no fallback) takes precedence and is retained. The conflict is recorded in D-011.
  logging:
    file: src/main/resources/logback.xml
    excluded_file: src/main/resources/logback-spring.xml
    strategy: JSON console plus corporate appender
    approved_decision: D-001
    evidence: E-005
  security:
    status: temporary-compatibility-baseline
    filter_chain: permit-all
    jwt_filter_registered_in_chain: false
    secret_fallback_allowed: false
    warning: The retained baseline does not enforce JWT authentication.
    approved_decision: D-002
    evidence: E-006
  openapi:
    tooling: Springdoc WebMVC UI
    hardcoded_server_declaration: false
    contract_metadata_in_template: false
    approved_decision: D-007
    evidence: E-012

delivery:
  jenkins:
    shared_library: master-library-bitbucket-new
    pipeline: MicroserviciosPipeline
    evidence: E-013
  docker:
    included: true
    strategy:
      - multi-stage builder and runtime images
      - Maven build with sanitized settings.xml
      - separated classes and dependencies
      - classpath entrypoint
    approved_decision: D-005
    evidence: E-014
  kubernetes:
    included: true
    artifacts:
      - template/config/deployment.yml.j2
      - template/config/ExternalSecret.yml.j2
      - template/config/configmap.yml.j2
    patterns:
      - rolling update
      - parameterized ConfigMap mount and Secret envFrom
      - ExternalSecret backed by a parameterized Vault store
      - non-root container with dropped capabilities and RuntimeDefault seccomp
    approved_decision: D-006
    evidence: E-015

