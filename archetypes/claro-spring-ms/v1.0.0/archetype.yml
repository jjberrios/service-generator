  - id: X-002
    category: credentials-and-private-infrastructure
    includes: datasource credentials, JWT fallback secrets, private IP addresses, private registry names, and machine-local paths
    evidence: E-020
  - id: X-003
    category: generated-and-local-state
    includes: target output, IDE metadata, runtime data, and unexplained binaries
    evidence: E-021
  - id: X-004
    category: future-specification-inputs
    includes: external Swagger/OpenAPI contracts and Sparx/architecture exports
    evidence: AGENTS.md
  - id: X-005
    category: unsupported-reference-dependencies
    includes: "nothing - superseded by D-012: every reference POM dependency (Kafka, HTTP client, common utilities, Tomcat override, JSON, Commons IO, Micrometer tracing, Spring Data JPA, Oracle driver and the rest) is a mandatory baseline dependency and must not be pruned"
