schema_version: "1.0"

archetype:
  id: claro-spring-ms
  version: "1.0.0"
  status: reconciled-ready-to-freeze
  description: Evidence-backed Java and Spring Boot microservice baseline.

governance:
  repository_policy: AGENTS.md
  approved_decisions: archetypes/claro-spring-ms/v1.0.0/decisions.md
  decision_precedence:
    - explicit current user instruction
    - approved decision in decisions.md
    - AGENTS.md
    - reference-project evidence
    - agent inference
  approved_decision_ids: [D-001, D-002, D-003, D-004, D-005, D-006, D-007, D-011, D-012, D-013, D-014]
  specifications_inspected: false
  generation_ownership:
    openapi:
      - HTTP contract and operations
      - request and response schemas
      - API-declared validation
      - server declarations and base URLs
    sparx:
      - behavior and business processes
      - integrations and external clients
      - persistence behavior
    joint_openapi_sparx:
      - mappings between contract and behavioral models
    archetype:
      - runtime and framework baseline
      - technical project structure
      - build, quality, logging, and delivery tooling

provenance:
  reference_root: input/reference/ms-individual
  extraction_method: extract-archetype
  reference_read_only: true
  reference_state_at_revision_preflight:
    git_status:
      - "M .checkstyle"
      - "M src/main/resources/application.properties"
    note: These reference changes predated this authorized revision; no reference file was written.
  deferred_inputs:
    - external OpenAPI/Swagger contracts
    - Sparx exports

platform:
  java:
    version: "21"
    evidence: E-001
  spring_boot:
    version: "3.4.1"
    parent: org.springframework.boot:spring-boot-starter-parent
    evidence: E-001
  build:
    system: Maven
    packaging: jar
    modules:
      - id: root
        path: .
        packaging: jar
    wrapper:
      wrapper_version: "3.3.4"
      maven_version: "3.9.12"
      distribution_type: only-script
      checksum_declared: false
    evidence: E-002

maven:
  reference_pom_baseline:
    mandatory: true
    approved_decision: D-012
    source: input/reference/ms-individual/pom.xml
    reference_sha256: 7fa2be88ba16d29843d0f861bb0c135cac027a2c53309d1dcc0b2f9a0ea0a5dc
    template: template/pom.xml
    template_sha256: 105db2589bf9c7cde9e20495df8cbda31b4fca5e8fe301ad6a2ff9a573f3edb6
    template_derivation: The template is the reference pom.xml byte-for-byte (line endings included) with only the declared substitutions. Reference literals are recorded so the reference model can be reconstructed
      without reading the reference project.
    policy:
      baseline_items: parent, Java/Spring baseline, properties, repositories (repository-url convention), dependencies with reference scopes/versions, build plugins and their configuration, quality configuration,
        profiles
      pruning_baseline_items: forbidden (never remove a baseline item because the target does not appear to use it)
      altering_baseline_values: forbidden (versions, scopes, repository URL composition, plugin configuration)
      target_specific_additions: allowed only as justified dependency additions recorded in the implementation plan; rendered after the baseline and never replacing it
      additional_jacoco_or_sonar_exclusions: allowed only as explicit justified additions; baseline exclusions stay
      applies_to: archetype planning, full generation and every @service-generator run
    substitutions:
    - id: project-group-id
      parameter: group_id
      token: __GROUP_ID__
      reference_value: com.claro.biometria.individual.support
      reference_snippets:
      - <groupId>com.claro.biometria.individual.support</groupId>
    - id: project-artifact-id-and-name
      parameter: artifact_id
      token: __ARTIFACT_ID__
      reference_value: ms-individual
      reference_snippets:
      - <artifactId>ms-individual</artifactId>
      - <name>ms-individual</name>
    - id: project-version
      parameter: project_version
      token: __PROJECT_VERSION__
      reference_value: 1.0.0-SNAPSHOT
      reference_snippets:
      - <version>1.0.0-SNAPSHOT</version>
    - id: sonar-application-class
      parameter: application_class
      token: __APPLICATION_CLASS__
      reference_value: IndividualApplication
      reference_snippets:
      - '**/IndividualApplication.java,'
    - id: jacoco-root-package-classes
      parameter: base_package_path
      token: __BASE_PACKAGE_PATH__
      reference_value: com/claro/biometria/individual/support
      reference_snippets:
      - com/claro/biometria/individual/support/*.class
    inventory:
      properties:
      - checkstyle-maven-plugin.version
      - claro-common-logger.version
      - claro-common-utilities-version
      - commons-io.version
      - doxia-core.version
      - httpclient5.version
      - jackson.databind.nullable.version
      - jacoco-maven-plugin.version
      - java.version
      - json.version
      - logstash-logback-encoder.version
      - maven-compiler-plugin.version
      - maven-surefire-plugin.version
      - repository-url
      - sonar.coverage.exclusions
      - springdoc.version
      - tomcat.version
      repositories:
      - local-claro-release
      - local-claro-snapshot
      - release
      dependencies:
      - com.claro.common:claro-common-logger
      - com.claro.common:claro-common-utilities
      - com.oracle.database.jdbc:ojdbc11
      - commons-io:commons-io
      - io.jsonwebtoken:jjwt-api
      - io.jsonwebtoken:jjwt-impl
      - io.jsonwebtoken:jjwt-jackson
      - io.micrometer:micrometer-tracing-bridge-brave
      - net.logstash.logback:logstash-logback-encoder
      - org.apache.httpcomponents.client5:httpclient5
      - org.apache.tomcat.embed:tomcat-embed-core
      - org.json:json
      - org.projectlombok:lombok
      - org.springdoc:springdoc-openapi-starter-webmvc-ui
      - org.springframework.boot:spring-boot-starter-actuator
      - org.springframework.boot:spring-boot-starter-data-jpa
      - org.springframework.boot:spring-boot-starter-security
      - org.springframework.boot:spring-boot-starter-test
      - org.springframework.boot:spring-boot-starter-validation
      - org.springframework.boot:spring-boot-starter-web
      - org.springframework.kafka:spring-kafka
      plugins:
      - org.apache.maven.plugins:maven-checkstyle-plugin
      - org.apache.maven.plugins:maven-compiler-plugin
      - org.apache.maven.plugins:maven-surefire-plugin
      - org.jacoco:jacoco-maven-plugin
      - org.springframework.boot:spring-boot-maven-plugin
      profiles:
      - local
  settings_file: template/settings.xml
  credentials_embedded: false
  coordinates:
    group_id_rule: same-as-base_package
    project_version_default: 1.0.0-SNAPSHOT
    target_version_override_allowed: true
    approved_decision: D-010
  corporate_repositories:
    enabled: true
    parameterized: false
    pom_convention: "reference convention: <repository-url> property plus repositories release, local-claro-snapshot and local-claro-release composed as ${repository-url}/<path>/ (D-012)"
    settings_baseline_static: true
    pom_repositories:
      - release
      - local-claro-snapshot
      - local-claro-release
    settings_features:
      - mirror
      - active custom-repos and public-repos profiles
      - release repository
      - snapshot repository
      - plugin repository
    approved_decision: D-009
    evidence: E-003
  approved_corporate_baseline:
    approved_decision: D-009
    pom_repository_base: http://artifactory.claro.pe/artifactory
    pom_repository_property: repository-url
    pom_repositories:
      - {id: release, url_composition: "${repository-url}/virtual-claro-maven/", url: http://artifactory.claro.pe/artifactory/virtual-claro-maven/, tokenized: false}
      - {id: local-claro-snapshot, url_composition: "${repository-url}/local-claro-maven-snapshot/", url: http://artifactory.claro.pe/artifactory/local-claro-maven-snapshot/, tokenized: false}
      - {id: local-claro-release, url_composition: "${repository-url}/local-claro-maven-release/", url: http://artifactory.claro.pe/artifactory/local-claro-maven-release/, tokenized: false}
    mirrors:
      - {id: claro-nexus, mirror_of: central, url: http://172.19.90.65:8081/repository/maven-public/}
      - {id: claro-nexus-list, mirror_of: '*', url: http://172.19.90.65:8081/repository/maven-releases/}
    settings_profiles:
      - id: custom-repos
        active: true
        repositories:
          - {id: maven-public, url: http://172.19.90.65:8081/repository/maven-releases/}
          - {id: maven-releases, url: http://172.19.90.65:8081/repository/maven-releases/}
        plugin_repositories:
          - {id: maven-plugins, url: http://172.19.90.65:8081/repository/maven-public/}
      - id: public-repos
        active: true
        repositories:
          - {id: central, url: https://repo.maven.apache.org/maven2/}
          - {id: spring-releases, url: https://repo.spring.io/release/}
        plugin_repositories:
          - {id: central, url: https://repo.maven.apache.org/maven2/}
          - {id: spring-plugins, url: https://repo.spring.io/plugins-release/}
    active_profiles: [custom-repos, public-repos]
    server_credentials: absent-in-approved-reference-settings
    execution_prerequisite: network or VPN access to the internal Maven mirror endpoints

