openapi: 3.0.1
info:
  title: dom-document-mailing-info
  description: 'Microservicio responsable de gestionar la trazabilidad del mantenimiento de la información de envío de los
    documentos.

    Permite realizar el registro, consulta y actualización de la información de envío en base de datos.'
  version: 1.0.0
  contact:
    name: Félix Escandón
    email: fescandon@hitss.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: /
tags:
- name: dom-document-mailing-info
  description: Operaciones relacionadas con la información de envío de documentos.
paths:
  /api/v1/mailing/info:
    get:
      tags:
      - dom-document-mailing-info
      summary: Busca la información de envio de documentos y retorna sus datos.
      description: "Permite buscar la información de envio de documentos.\n\nEl servicio soporta los siguientes tipos de procesos:\n\
        \  - Gestión de Documentos.\n  - Gestión de la Información de envio de Documentos."
      operationId: getMailingInfo
      parameters:
      - $ref: '#/components/parameters/X-Correlation-Id'
      - $ref: '#/components/parameters/X-Client-Version-Id'
      - $ref: '#/components/parameters/X-App-Id'
      - $ref: '#/components/parameters/X-Channel'
      - $ref: '#/components/parameters/X-Request-Id'
      - $ref: '#/components/parameters/X-User-Id'
      - $ref: '#/components/parameters/Traceparent'
      - name: id
        in: query
        required: false
        description: Identificador único de la información de envio de documento.
        schema:
          type: string
        example: '001'
      - name: emailTo
        in: query
        required: false
        description: Destinatario de la información de envio de documento.
        schema:
          type: string
        example: cliente@gmail.com
      - name: emailFrom
        in: query
        required: false
        description: Remitente de la información de envio de documento.
        schema:
          type: string
        example: usuario@claro.com.pe
      - name: emailSubject
        in: query
        required: false
        description: Asunto del correo de la información de envio de documento.
        schema:
          type: string
        example: Recibos de cliente
      - name: cc
        in: query
        required: false
        description: Correo de los destinatarios de la información de envio de documento.
        schema:
          type: string
        example: cliente@gmail.com,cliente1@gmail.com,cliente@gmail.com
      - name: bcc
        in: query
        required: false
        description: Correo de los destinatarios ocultos de la información de envio de documento.
        schema:
          type: string
        example: usuario@claro.com.pe,usuario2@claro.com.pe,usuario3@claro.com.pe
      - name: successfulDelivery
        in: query
        required: false
        description: Indica si el envío fue exitoso.
        schema:
          type: string
          enum:
          - '0'
          - '1'
        example: '1'
      - name: requestId
        in: query
        required: false
        description: Id de la Solicitud relacionada de la información de envio de documento.
        schema:
          type: string
        example: '001'
      - name: limit
        in: query
        required: false
        description: Límite de la cantidad de resultados de la búsqueda.
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 20
      - name: offset
        in: query
        required: false
        description: Número de registros desplazados en la paginación.
        schema:
          type: integer
          format: int32
          minimum: 0
        example: 4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMailingInfoResponse'
              example:
                code: 200
                message: Operación exitosa
                data:
                  mailingInfo:
                  - id: '001'
                    to: cliente@gmail.com
                    from: usuario@claro.com.pe
                    subject: Recibos de cliente
                    cc: cliente@gmail.com,cliente1@gmail.com,cliente@gmail.com
                    bcc: usuario@claro.com.pe,usuario2@claro.com.pe,usuario3@claro.com.pe
                    emailBody: html<body> /correo ejmeplo /<body>
                    successfulDelivery: '1'
                    requestId: '002'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: BAD_REQUEST
                code: 400
                subType: IDF1
                type: MissingParameters
                message: PROCESGETMAILINGINFOSERVICE_ERROR
                detail: Parámetros obligatorios incompletos. Ingrese al menos un valor en los campos.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: NOT_FOUND
                code: 404
                subType: IDF2
                type: ParameterValueNotFound
                message: PROCESGETMAILINGINFOSERVICE_ERROR
                detail: No se encontraron resultados con los datos ingresados.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: INTERNAL_SERVER_ERROR
                code: 500
                subType: IDT3
                type: InternalError
                message: PROCESGETMAILINGINFOSERVICE_ERROR
                detail: 'Error interno al procesar la transacción: [ERROR_DETAIL]'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: SERVICE_UNAVAILABLE
                code: 503
                subType: IDT2
                type: ServiceUnavailable
                message: PROCESGETMAILINGINFOSERVICE_ERROR
                detail: 'Error de disponibilidad en [SERVICE_NAME] - Detalle: [ERROR_DETAIL]'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: GATEWAY_TIMEOUT
                code: 504
                subType: IDT1
                type: TimeoutException
                message: PROCESGETMAILINGINFOSERVICE_ERROR
                detail: 'Error de timeout en [SERVICE_NAME] - Detalle: [ERROR_DETAIL]'
    post:
      tags:
      - dom-document-mailing-info
      summary: Registra los datos de la información de envio de documento.
      description: "Permite registrar los datos de la información de envio de documento.\n\nEl servicio soporta el registro\
        \ en los siguientes tipos de procesos:\n  - Gestión de Documentos.\n  - Gestión de la Información de Envio de Documentos."
      operationId: createMailingInfo
      parameters:
      - $ref: '#/components/parameters/X-Correlation-Id'
      - $ref: '#/components/parameters/X-Client-Version-Id'
      - $ref: '#/components/parameters/X-App-Id'
      - $ref: '#/components/parameters/X-Channel'
      - $ref: '#/components/parameters/X-Request-Id'
      - $ref: '#/components/parameters/X-User-Id'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegMailingInfoRequest'
            example:
              to: cliente@gmail.com
              from: usuario@claro.com.pe
              subject: Recibos de cliente
              cc: cliente@gmail.com,cliente1@gmail.com,cliente@gmail.com
              bcc: usuario@claro.com.pe,usuario2@claro.com.pe,usuario3@claro.com.pe
              emailBody: html<body> /correo ejmeplo /<body>
              requestId: '002'
              successfulDelivery: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegMailingInfoResponse'
              example:
                code: 200
                message: Operación exitosa
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: BAD_REQUEST
                code: 400
                subType: IDF1
                type: MissingParameters
                message: PROCESREGMAILINGINFOSERVICE_ERROR
                detail: Parámetros obligatorios incompletos. [MAILINGINFONAME] presenta valor no válido.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: INTERNAL_SERVER_ERROR
                code: 500
                subType: IDT3
                type: InternalError
                message: PROCESREGMAILINGINFOSERVICE_ERROR
                detail: 'Error interno al procesar la transacción: [ERROR_DETAIL]'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: SERVICE_UNAVAILABLE
                code: 503
                subType: IDT2
                type: ServiceUnavailable
                message: PROCESREGMAILINGINFOSERVICE_ERROR
                detail: 'Error de disponibilidad en [SERVICE_NAME] - Detalle: [ERROR_DETAIL]'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: GATEWAY_TIMEOUT
                code: 504
                subType: IDT1
                type: TimeoutException
                message: PROCESREGMAILINGINFOSERVICE_ERROR
                detail: 'Error de timeout en [SERVICE_NAME] - Detalle: [ERROR_DETAIL]'
  /api/v1/mailing/info/{id}:
    patch:
      tags:
      - dom-document-mailing-info
      summary: Actualiza los datos de la información de envio de documento.
      description: "Permite actualizar los datos de la información de envio de documento\nasociado al identificador indicado\
        \ en la ruta.\n\nEl servicio soporta los siguientes tipos de procesos:\n  - Gestión de Documentos.\n  - Gestión de\
        \ la Información de envio de Documentos."
      operationId: updateMailingInfo
      parameters:
      - $ref: '#/components/parameters/X-Correlation-Id'
      - $ref: '#/components/parameters/X-Client-Version-Id'
      - $ref: '#/components/parameters/X-App-Id'
      - $ref: '#/components/parameters/X-Channel'
      - $ref: '#/components/parameters/X-Request-Id'
      - $ref: '#/components/parameters/X-User-Id'
      - $ref: '#/components/parameters/Traceparent'
      - name: id
        in: path
        required: true
        description: Identificador único de la información de envio de documento.
        schema:
          type: string
          minLength: 1
        example: '6584'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMailingInfoRequest'
            example:
              to: cliente@gmail.com
              from: usuario@claro.com.pe
              subject: Recibos de cliente
              cc: cliente@gmail.com,cliente1@gmail.com,cliente@gmail.com
              bcc: usuario@claro.com.pe,usuario2@claro.com.pe,usuario3@claro.com.pe
              emailBody: html<body> /correo ejmeplo /<body>
              requestId: '002'
              successfulDelivery: '1'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateMailingInfoResponse'
              example:
                code: 200
                message: Operación exitosa
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: BAD_REQUEST
                code: 400
                subType: IDF1
                type: MissingParameters
                message: PROCESUPDATEMAILINGINFOSERVICE_ERROR
                detail: Parámetros obligatorios incompletos. [MAILINGINFONAME] presenta valor no válido.
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: NOT_FOUND
                code: 404
                subType: IDF2
                type: ParameterValueNotFound
                message: PROCESUPDATEMAILINGINFOSERVICE_ERROR
                detail: No se encontró la información de envio de documento con el identificador indicado.
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: INTERNAL_SERVER_ERROR
                code: 500
                subType: IDT3
                type: InternalError
                message: PROCESUPDATEMAILINGINFOSERVICE_ERROR
                detail: 'Error interno al procesar la transacción: [ERROR_DETAIL]'
        '503':
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: SERVICE_UNAVAILABLE
                code: 503
                subType: IDT2
                type: ServiceUnavailable
                message: PROCESUPDATEMAILINGINFOSERVICE_ERROR
                detail: 'Error de disponibilidad en [SERVICE_NAME] - Detalle: [ERROR_DETAIL]'
        '504':
          description: Gateway Timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: GATEWAY_TIMEOUT
                code: 504
                subType: IDT1
                type: TimeoutException
                message: PROCESUPDATEMAILINGINFOSERVICE_ERROR
                detail: 'Error de timeout en [SERVICE_NAME] - Detalle: [ERROR_DETAIL]'
components:
  parameters:
    X-Correlation-Id:
      name: x-correlation-id
      in: header
      required: true
      description: Header generado por el API Gateway. Es único.
      schema:
        type: string
      example: df39ead2-4c3a-4680-855f-f3dba1b1610c
    X-Client-Version-Id:
      name: x-client-version-id
      in: header
      required: true
      description: Versión de la aplicación.
      schema:
        type: string
      example: 1.0.0
    X-App-Id:
      name: x-app-id
      in: header
      required: true
      description: ClientID de la aplicación en Keycloak.
      schema:
        type: string
      example: CRM_POS
    X-Channel:
      name: x-channel
      in: header
      required: true
      description: Tipo de canal.
      schema:
        type: string
      example: WEB
    X-Request-Id:
      name: x-request-id
      in: header
      required: true
      description: Identificador único del request.
      schema:
        type: string
      example: 35e6ec23-d2c6-42e4-a7b1-fc3977a76be2
    X-User-Id:
      name: x-user-id
      in: header
      required: true
      description: Usuario que inicia la invocación.
      schema:
        type: string
      example: C500457
    Traceparent:
      name: traceparent
      in: header
      required: true
      description: Header OpenTelemetry.
      schema:
        type: string
      example: 00-4d186321c1a7f0f354b297e8914ab240-4b2a9f18c30eb2f1-01
  schemas:
    UpdateMailingInfoRequest:
      type: object
      description: Datos que se pueden actualizar de la información de envio de documento.
      minProperties: 1
      properties:
        to:
          type: string
          description: Destinatario de la información de envio de documento.
          example: cliente@gmail.com
          format: email
        from:
          type: string
          description: Remitente de la información de envio de documento.
          example: usuario@claro.com.pe
          format: email
        subject:
          type: string
          description: Asunto del correo de la información de envio de documento.
          example: Recibos de cliente
        cc:
          type: string
          description: Correo de los destinatarios de la información de envio de documento.
          example: cliente@gmail.com,cliente1@gmail.com,cliente@gmail.com
        bcc:
          type: string
          description: Correo de los destinatarios ocultos de la información de envio de documento.
          example: usuario@claro.com.pe,usuario2@claro.com.pe,usuario3@claro.com.pe
        emailBody:
          type: string
          description: Cuerpo del correo.
          example: html<body> /correo ejmeplo /<body>
        successfulDelivery:
          type: string
          description: Indica si el envío fue exitoso.
          example: '1'
          enum:
          - '0'
          - '1'
        requestId:
          type: string
          description: Id de la Solicitud relacionada de la información de envio de documento.
          example: '001'
    UpdateMailingInfoResponse:
      type: object
      properties:
        code:
          type: integer
          description: Código HTTP de la respuesta.
          example: 200
        message:
          type: string
          description: Mensaje descriptivo del resultado.
          example: Operación exitosa
      required:
      - code
      - message
    RegMailingInfoResponse:
      type: object
      properties:
        code:
          type: integer
          description: Código HTTP de la respuesta.
          example: 200
        message:
          type: string
          description: Mensaje descriptivo del resultado.
          example: Operación exitosa
      required:
      - code
      - message
    GetMailingInfoResponse:
      type: object
      properties:
        code:
          type: integer
          description: Código HTTP de la respuesta.
          example: 200
        message:
          type: string
          description: Mensaje descriptivo del resultado.
          example: Operación exitosa
        data:
          $ref: '#/components/schemas/GetMailingInfoData'
      required:
      - code
      - message
      - data
    GetMailingInfoData:
      type: object
      description: Lista de información de envio de documentos.
      properties:
        mailingInfo:
          type: array
          description: Campos de la Información de Envio de documentos.
          items:
            $ref: '#/components/schemas/GetMailingInfoListMailingInfo'
      required:
      - mailingInfo
    GetMailingInfoListMailingInfo:
      type: object
      description: Datos de la información de envio de documento.
      properties:
        id:
          type: string
          description: Identificador único de la información de envio de documento.
          example: '001'
        to:
          type: string
          description: Destinatario de la información de envio de documento.
          example: cliente@gmail.com
          format: email
        from:
          type: string
          description: Remitente de la información de envio de documento.
          example: usuario@claro.com.pe
          format: email
        subject:
          type: string
          description: Asunto del correo de la información de envio de documento.
          example: Recibos de cliente
        cc:
          type: string
          description: Correo de los destinatarios de la información de envio de documento.
          example: cliente@gmail.com,cliente1@gmail.com,cliente@gmail.com
        bcc:
          type: string
          description: Correo de los destinatarios ocultos de la información de envio de documento.
          example: usuario@claro.com.pe,usuario2@claro.com.pe,usuario3@claro.com.pe
        emailBody:
          type: string
          description: Cuerpo del correo.
          example: html<body> /correo ejmeplo /<body>
        successfulDelivery:
          type: string
          description: Indica si el envío fue exitoso.
          example: '1'
          enum:
          - '0'
          - '1'
        requestId:
          type: string
          description: Id de la Solicitud relacionada de la información de envio de documento.
          example: '001'
    RegMailingInfoRequest:
      type: object
      description: Datos de la información de envio de documento.
      required:
      - to
      - from
      - subject
      - emailBody
      - requestId
      properties:
        to:
          type: string
          description: Destinatario de la información de envio de documento.
          example: cliente@gmail.com
          format: email
        from:
          type: string
          description: Remitente de la información de envio de documento.
          example: usuario@claro.com.pe
          format: email
        subject:
          type: string
          description: Asunto del correo de la información de envio de documento.
          example: Recibos de cliente
        cc:
          type: string
          description: Correo de los destinatarios de la información de envio de documento.
          example: cliente@gmail.com,cliente1@gmail.com,cliente@gmail.com
        bcc:
          type: string
          description: Correo de los destinatarios ocultos de la información de envio de documento.
          example: usuario@claro.com.pe,usuario2@claro.com.pe,usuario3@claro.com.pe
        emailBody:
          type: string
          description: Cuerpo del correo.
          example: html<body> /correo ejmeplo /<body>
        successfulDelivery:
          type: string
          description: Indica si el envío fue exitoso.
          example: '1'
          enum:
          - '0'
          - '1'
        requestId:
          type: string
          description: Id de la Solicitud relacionada de la información de envio de documento.
          example: '001'
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          description: Estado HTTP del error.
          example: BAD_REQUEST
        code:
          type: integer
          description: Código numérico del error.
          example: 400
        subType:
          type: string
          description: Subtipo del error.
          example: IDF1
        type:
          type: string
          description: Tipo de error.
          example: MissingParameters
        message:
          type: string
          description: Mensaje de error técnico.
          example: PROCES_SERVICE_ERROR
        detail:
          type: string
          description: Detalle específico del error.
          example: Parámetros obligatorios incompletos.
